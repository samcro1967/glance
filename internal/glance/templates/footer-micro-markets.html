{{ define "footer-micro-markets" }}<span class="footer-micro-item footer-micro-markets" data-widget-id="{{ .GetID }}">{{ range .Markets }}{{ if ne .SymbolLink "" }}<a class="footer-micro-market" href="{{ .SymbolLink | safeURL }}"{{ if not $.SameTab }} target="_blank"{{ end }} rel="noreferrer"><span class="color-highlight">{{ .Symbol }}</span><span class="{{ if gt .PercentChange 0.0 }}color-positive{{ else if lt .PercentChange 0.0 }}color-negative{{ end }}">{{ printf "%+.2f" .PercentChange }}%</span></a>{{ else }}<span class="footer-micro-market"><span class="color-highlight">{{ .Symbol }}</span><span class="{{ if gt .PercentChange 0.0 }}color-positive{{ else if lt .PercentChange 0.0 }}color-negative{{ end }}">{{ printf "%+.2f" .PercentChange }}%</span></span>{{ end }}{{ end }}</span>{{ end }}{{ template "footer-micro-markets" . }}
