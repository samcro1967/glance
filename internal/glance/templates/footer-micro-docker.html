{{ define "footer-micro-docker" }}<span class="footer-micro-item footer-micro-docker" data-widget-id="{{ .GetID }}">{{ if .Summary }}<span class="footer-micro-docker-summary"><span class="footer-micro-status {{ if and (gt .TotalCount 0) (eq .OKCount .TotalCount) }}footer-micro-status-ok{{ else }}footer-micro-status-error{{ end }}"></span><span>Docker</span><span>{{ .OKCount }}/{{ .TotalCount }}</span></span>{{ else if .Selected }}{{ if ne .Selected.URL "" }}<a class="footer-micro-docker-container" href="{{ .Selected.URL | safeURL }}"{{ if not .Selected.SameTab }} target="_blank"{{ end }} rel="noreferrer"><span class="footer-micro-status {{ if eq .Selected.StateIcon "ok" }}footer-micro-status-ok{{ else }}footer-micro-status-error{{ end }}"></span><span>{{ .Selected.Name }}</span></a>{{ else }}<span class="footer-micro-docker-container"><span class="footer-micro-status {{ if eq .Selected.StateIcon "ok" }}footer-micro-status-ok{{ else }}footer-micro-status-error{{ end }}"></span><span>{{ .Selected.Name }}</span></span>{{ end }}{{ else }}<span class="footer-micro-docker-container"><span class="footer-micro-status footer-micro-status-error"></span><span>{{ .Container }}</span></span>{{ end }}</span>{{ end }}{{ template "footer-micro-docker" . }}
