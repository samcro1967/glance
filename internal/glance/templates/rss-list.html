{{ template "widget-base.html" . }}

{{ define "widget-content" }}
<ul class="list glance-list rss-list collapsible-container{{ if .SingleLineTitles }} single-line-titles{{ end }}" data-collapse-after="{{ .CollapseAfter }}">
    {{ range .Items }}
    <li class="glance-list-row">
        <a class="title size-title-dynamic color-primary-if-not-visited" href="{{ .Link }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Title }}</a>
        <ul class="list-horizontal-text glance-list-row-meta flex-nowrap">
            <li {{ dynamicRelativeTimeAttrs .PublishedAt }}></li>
            <li class="min-width-0">
                <a class="block text-truncate" href="{{ .ChannelURL }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .ChannelName }}</a>
            </li>
        </ul>
    </li>
    {{ else }}
    <li>{{ .NoItemsMessage }}</li>
    {{ end }}
</ul>
{{ end }}
