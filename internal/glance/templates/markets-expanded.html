<div class="widget-expanded-market-grid">{{ range .Markets }}<section class="widget-expanded-card"><div class="flex justify-between gap-15"><div><a{{ if .SymbolLink }} href="{{ .SymbolLink }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}{{ end }} class="size-h2 color-highlight">{{ .Symbol }}</a><div>{{ .Name }}</div></div><div class="text-right"><div class="size-h2 {{ if gt .PercentChange 0.0 }}color-positive{{ else if lt .PercentChange 0.0 }}color-negative{{ end }}">{{ printf "%+.2f" .PercentChange }}%</div><div>{{ .CurrencySymbol }}{{ .Price | formatPriceWithPrecision .PriceHint }} {{ .Currency }}</div></div></div><a{{ if .ChartLink }} href="{{ .ChartLink }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}{{ end }}><svg class="widget-expanded-market-chart" viewBox="0 0 100 50"><polyline fill="none" stroke="var(--color-text-subdue)" stroke-linejoin="round" stroke-width="1.5px" points="{{ .SvgChartPoints }}" vector-effect="non-scaling-stroke"></polyline></svg></a></section>{{ end }}</div>
