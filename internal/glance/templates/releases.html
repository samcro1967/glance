{{ template "widget-base.html" . }}

{{ define "widget-content" }}
<ul class="list glance-list collapsible-container" data-collapse-after="{{ .CollapseAfter }}">
    {{ range .Releases }}
    <li class="glance-list-row">
        <div class="flex items-center gap-10 glance-list-row-primary">
            <a class="size-h4 block text-truncate color-primary-if-not-visited" href="{{ .NotesUrl }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Name }}</a>
            {{ if $.ShowSourceIcon }}
            <img class="flat-icon release-source-icon" src="{{ .SourceIconURL }}" alt="" loading="lazy">
            {{ end }}
        </div>
        <ul class="list-horizontal-text glance-list-row-meta">
            <li {{ dynamicRelativeTimeAttrs .TimeReleased }}></li>
            <li>{{ .Version }}</li>
            {{ if gt .Downvotes 3 }}
            <li>{{ .Downvotes | formatNumber }} ⚠</li>
            {{ end }}
        </ul>
    </li>
    {{ end }}
</ul>
{{ end }}
