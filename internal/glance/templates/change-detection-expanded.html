<div class="widget-expanded-section">
{{ if .ChangeDetections }}<table class="glance-table widget-expanded-table widget-expanded-change-table" data-glance-table data-glance-table-search="true" data-glance-table-state="change-detection" data-glance-table-search-placeholder="Filter watches…"><thead><tr><th data-column-type="text">Watch</th><th data-column-type="number">Last changed</th><th data-column-sortable="false">Previous hash</th><th data-column-sortable="false">Review</th></tr></thead><tbody>{{ range .ChangeDetections }}<tr><td class="color-highlight"><a href="{{ .URL }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Title }}</a></td><td data-order="{{ .LastChanged.Unix }}"><span {{ dynamicRelativeTimeAttrs .LastChanged }}></span></td><td class="text-truncate" title="{{ .PreviousHash }}">{{ .PreviousHash }}</td><td><a class="color-primary-if-not-visited" href="{{ .DiffURL }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>View diff</a></td></tr>{{ end }}</tbody></table>{{ else }}<div class="text-center">No watches configured</div>{{ end }}
</div>
