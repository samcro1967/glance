<div class="widget-expanded-section">
{{ if .ChangeDetections }}<div class="widget-expanded-table widget-expanded-change-table"><div class="widget-expanded-table-head"><span>Watch</span><span>Last changed</span><span>Previous hash</span><span>Review</span></div>{{ range .ChangeDetections }}<div class="widget-expanded-table-row"><span class="color-highlight"><a href="{{ .URL }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Title }}</a></span><span {{ dynamicRelativeTimeAttrs .LastChanged }}></span><span class="text-truncate" title="{{ .PreviousHash }}">{{ .PreviousHash }}</span><span><a class="color-primary-if-not-visited" href="{{ .DiffURL }}"{{ if $.OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>View diff</a></span></div>{{ end }}</div>{{ else }}<div class="text-center">No watches configured</div>{{ end }}
</div>
