<div class="widget-expanded-section">
{{ if .Torrents }}<table class="glance-table widget-expanded-table widget-expanded-torrent-table" data-glance-table data-glance-table-search="true" data-glance-table-state="torrenting" data-glance-table-search-placeholder="Filter torrents…"><thead><tr><th data-column-type="text">Torrent</th><th data-column-type="text">State</th><th data-column-type="number">Progress</th><th data-column-type="number">Downloaded / Size</th><th data-column-type="number">ETA</th></tr></thead><tbody>{{ range .Torrents }}<tr><td class="color-highlight text-truncate" title="{{ .Name }}">{{ .Name }}</td><td>{{ .StateLabel }}</td><td data-order="{{ .Progress }}">{{ .ProgressText }}</td><td data-order="{{ .SizeBytes }}">{{ .Downloaded }} / {{ .Size }}</td><td{{ if not .Completed }} data-order="{{ .ETASeconds }}"{{ end }}>{{ if .Completed }}Complete{{ else }}{{ .ETA }}{{ end }}</td></tr>{{ end }}</tbody></table>{{ else }}<div class="text-center">No torrents available to show.</div>{{ end }}
</div>
