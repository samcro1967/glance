{{ define "footer-micro-monitor" }}<span class="footer-micro-item footer-micro-monitor" data-widget-id="{{ .GetID }}">{{ if and .ShowFailingOnly (not .HasFailing) }}<span class="footer-micro-monitor-all-ok"><span class="footer-micro-status footer-micro-status-ok"></span>All online</span>{{ else }}{{ range .Sites }}{{ if not (and $.ShowFailingOnly (eq .StatusStyle "ok")) }}<a class="footer-micro-monitor-site" href="{{ .URL | safeURL }}"{{ if not .SameTab }} target="_blank"{{ end }} rel="noreferrer"><span class="footer-micro-status footer-micro-status-{{ .StatusStyle }}"></span>{{ if .Icon.URL }}<img class="footer-micro-icon{{ if .Icon.AutoInvert }} flat-icon{{ end }}" src="{{ .Icon.URL }}" alt="" loading="lazy">{{ end }}<span>{{ .Title }}</span></a>{{ end }}{{ end }}{{ end }}</span>{{ end }}{{ template "footer-micro-monitor" . }}
