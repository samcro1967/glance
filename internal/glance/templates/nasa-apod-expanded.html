<article class="widget-expanded-apod">{{ if eq .APOD.MediaType "image" }}<a class="size-h2 color-highlight" href="{{ .APOD.Permalink | safeExternalURL }}"{{ if .OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .APOD.Title }}</a><img class="widget-expanded-apod-image" src="{{ .APOD.HDURL | safeURL }}" alt="{{ .APOD.Alt }}" loading="lazy"><div class="color-subdue">{{ .APOD.Date }}{{ if .APOD.Credit }} · {{ .APOD.Credit }}{{ end }}{{ if .APOD.Copyright }} · {{ .APOD.Copyright }}{{ end }}</div>{{ if .APOD.Explanation }}<p class="widget-expanded-copy">{{ .APOD.Explanation }}</p>{{ end }}{{ else }}<div class="text-center">No image available today.</div>{{ end }}</article>
