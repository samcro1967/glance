{{ define "video-card-contents" }}
<img class="video-thumbnail thumbnail" loading="lazy" src="{{ .Video.ThumbnailUrl }}" alt="">
<div class="margin-top-10 margin-bottom-widget flex flex-column grow padding-inline-widget">
    <a class="text-truncate-2-lines margin-bottom-auto color-primary-if-not-visited" href="{{ .Video.Url | safeURL }}"{{ if .OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Video.Title }}</a>
    <ul class="list-horizontal-text flex-nowrap margin-top-7">
        <li class="shrink-0" {{ dynamicRelativeTimeAttrs .Video.TimePosted }}></li>
        <li class="min-width-0">
            <a class="block text-truncate" href="{{ .Video.AuthorUrl }}"{{ if .OpenLinksInNewTab }} target="_blank" rel="noreferrer"{{ end }}>{{ .Video.Author }}</a>
        </li>
    </ul>
</div>
{{ end }}
