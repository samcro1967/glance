name: PR validation

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: v2.14.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz" \
            --output /tmp/golangci-lint.tar.gz
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-checksums.txt" \
            --output /tmp/golangci-lint-checksums.txt
          archive="golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz"
          expected="$(grep "  ${archive}$" /tmp/golangci-lint-checksums.txt)"
          test -n "$expected"
          printf "%s\n" "$expected" | sed "s|  ${archive}$|  /tmp/golangci-lint.tar.gz|" | sha256sum --check
          tar -xzf /tmp/golangci-lint.tar.gz --strip-components=1 \
            -C /tmp "golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint"
          sudo install -m 0755 /tmp/golangci-lint /usr/local/bin/golangci-lint
          rm -f /tmp/golangci-lint.tar.gz /tmp/golangci-lint-checksums.txt /tmp/golangci-lint
          golangci-lint version

      - name: Run repository validation
        run: make check BASE_REF="${{ github.event.pull_request.base.sha }}" GOLANGCI_LINT_MODE=native
