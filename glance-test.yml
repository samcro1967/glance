                    </div>
                    <div class="glance-key-value">
                      <span class="glance-key">Issues</span>
                      <strong class="glance-value">{{ .JSON.Int "open_issues_count" | formatNumber }}</strong>
                    </div>
                  </div>
                </div>
              </div>
              <div class="glance-state margin-top-10">Semantic state presentation</div>
              <div class="glance-progress margin-top-10"><div style="width: 68%"></div></div>

          - type: unit-converter
            title: Unit Converter

