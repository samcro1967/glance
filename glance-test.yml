# Canonical configuration for the local Glance development test instance.
#
# This file is intentionally committed to the repository. Keep its contents
# public and test-safe. Do not add credentials, tokens, private URLs, or other
# environment-specific secrets.
#
# Representative fork features and hierarchical configuration behavior are
# collected on dedicated pages so this dashboard provides a repeatable source
# for local integration testing and documentation screenshots.

server:
  host: 0.0.0.0
  port: 18080

branding:
  app-name: "Glance Test"

theme:
  light: false

# ---------------------------------------------------------------------------
# Hierarchical widget defaults
# ---------------------------------------------------------------------------
#
# This intentionally exercises the supported inheritance model:
#
#   built-in default
#       -> global default
#       -> widget-type default
#       -> widget instance
#       -> child/source override
#
# Global defaults exercise every common capability and the generic HTTP
# capabilities that are valid at global scope. Type defaults exercise the
# reusable list and HTTP capability families. Widgets below contain selected
# explicit overrides so the test instance covers precedence as well as simple
# inheritance.
#
# Some presentation defaults are intentionally obvious so inheritance can be
# verified visually. Individual widgets override them where appropriate.

widget-defaults:
  global:
    title: "Inherited Widget Title"
    title-url: https://github.com/samcro1967/glance
    hide-header: false
    css-class: test-default-global
    cache: 30m
    new-tab: true
    timeout: 10s
    allow-insecure: false
    headers:
      X-Glance-Test: global

  types:
    rss:
      title: "Inherited RSS"
      cache: 15m
      new-tab: false
      limit: 6
      collapse-after: 4
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: rss
      basic-auth:
        username: glance-test
        password: glance-test

    monitor:
      title: "Inherited Monitor"
      cache: 1m
      new-tab: false
      timeout: 5s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: monitor
      basic-auth:
        username: glance-test
        password: glance-test

    hacker-news:
      title: "Inherited Hacker News"
      limit: 6
      collapse-after: 4
      new-tab: false

    lobsters:
      title: "Inherited Lobsters"
      limit: 6
      collapse-after: 4
      new-tab: false

    reddit:
      title: "Inherited Reddit"
      limit: 6
      collapse-after: 4
      new-tab: false

    releases:
      title: "Inherited Releases"
      limit: 6
      collapse-after: 4
      new-tab: false

    videos:
      title: "Inherited Videos"
      limit: 8
      collapse-after: 6
      collapse-after-rows: 2
      new-tab: false

    twitch-top-games:
      title: "Inherited Twitch Games"
      limit: 8
      collapse-after: 5
      new-tab: false

    twitch-channels:
      title: "Inherited Twitch Channels"
      collapse-after: 5
      new-tab: false

    ics-events:
      title: "Inherited ICS Events"
      limit: 6
      collapse-after: 4
      new-tab: false
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: ics
      basic-auth:
        username: glance-test
        password: glance-test

    custom-api:
      title: "Inherited Custom API"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: custom-api
      basic-auth:
        username: glance-test
        password: glance-test

    extension:
      title: "Inherited Extension"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: extension
      basic-auth:
        username: glance-test
        password: glance-test

    markets:
      title: "Inherited Markets"
      new-tab: false

    stocks:
      title: "Inherited Stocks Alias"
      new-tab: true

    repository:
      title: "Inherited Repository"
      new-tab: false

    search:
      title: "Inherited Search"
      new-tab: false

    bookmarks:
      title: "Inherited Bookmarks"
      new-tab: false

pages:
  # ---------------------------------------------------------------------------
  # Hierarchical defaults integration
  # ---------------------------------------------------------------------------
  - name: Defaults
    slug: defaults
    width: wide

    columns:
      - size: medium
        widgets:
          # Exercises RSS type defaults and child/source inheritance.
          #
          # The first feed inherits type HTTP defaults. The second feed
          # explicitly overrides child-capable values, proving the most
          # specific configured value wins.
          - type: rss
            title: RSS Instance Override
            cache: 20m
            feeds:
              - url: https://selfh.st/rss/
                title: Inherited Feed

              - url: https://www.joshwcomeau.com/rss.xml
                title: Explicit Feed Override
                limit: 2
                timeout: 12s
                allow-insecure: false
                headers:
                  X-Glance-Test-Child: rss
                basic-auth:
                  username: ""
                  password: ""

          # Common capabilities apply recursively through containers.
          - type: group
            title: Nested Defaults
            widgets:
              - type: hacker-news

              - type: stack
                title: Nested Stack
                widgets:
                  - type: lobsters

                  - type: reddit
                    subreddit: selfhosted

      - size: medium
        widgets:
          # Exercises list type defaults with an explicit instance override.
          - type: hacker-news
            title: Hacker News Instance Override
            limit: 3
            collapse-after: 2

          - type: releases
            repositories:
              - glanceapp/glance
              - samcro1967/glance
              - immich-app/immich
              - syncthing/syncthing

          - type: videos
            style: grid-cards
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw
              - UCR-DXc1voovS8nhAvccRZhg
              - UCsBjURrPoezykLs9EqgamOA

      - size: medium
        widgets:
          # Exercises common title/title-url/new-tab behavior.
          - type: weather
            title: Weather Instance Override
            title-url: https://open-meteo.com/
            location: St. Louis, Missouri, United States
            units: imperial

          # markets and stocks intentionally have different type defaults even
          # though both resolve to the same implementation.
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: AAPL
                name: Apple

          - type: stocks
            markets:
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: NVIDIA

  # ---------------------------------------------------------------------------
  # Status Bar
  # ---------------------------------------------------------------------------
  - name: Status Bar
    slug: status-bar
    width: wide

    head-widgets:
      - type: status-bar
        title: Status Bar Ticker
        mode: ticker
        widgets:
          - type: weather
            title: Weather
            location: St. Louis, Missouri, United States
            units: imperial

          - type: markets
            title: Markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: NVIDIA

          - type: rss
            title: RSS
            limit: 5
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                basic-auth:
                  username: ""
                  password: ""

          # Status Bar Custom API uses a locked compact response contract.
          # Enable when a compatible endpoint is available.
          # - type: custom-api
          #   title: Live Scores
          #   url: https://example.com/status.json
          #   cache: 1m
          # Expected response has an items array with icon1, url, line1, line2, and icon2.

    columns:
      - size: full
        widgets:
          - type: hacker-news
            title: Technology News
            limit: 5
            collapse-after: 5

    bottom-widgets:
      - type: status-bar
        title: Status Bar Wrap
        mode: wrap
        widgets:
          - type: weather
            title: Weather
            location: St. Louis, Missouri, United States
            units: imperial

          - type: markets
            title: Markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

          - type: rss
            title: RSS
            limit: 3
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                basic-auth:
                  username: ""
                  password: ""

  # ---------------------------------------------------------------------------
  # Layout features
  # ---------------------------------------------------------------------------
  - name: Layout
    slug: layout
    width: wide

    columns:
      - size: medium
        widgets:
          - type: weather
            title: First Medium Column
            location: St. Louis, Missouri, United States
            units: imperial

      - size: medium
        widgets:
          - type: hacker-news
            title: Second Medium Column
            limit: 5
            collapse-after: 5

      - size: medium
        widgets:
          - type: reddit
            title: Third Medium Column
            subreddit: selfhosted
            limit: 5
            collapse-after: 5

    bottom-widgets:
      - type: rss
        title: Bottom Widgets
        style: horizontal-cards
        limit: 5
        feeds:
          - url: https://selfh.st/rss/
            title: selfh.st
            basic-auth:
              username: ""
              password: ""

  # ---------------------------------------------------------------------------
  # Medium + Full proportional layout
  # ---------------------------------------------------------------------------
  - name: Proportional
    slug: proportional
    width: wide

    columns:
      - size: medium
        widgets:
          - type: weather
            title: Medium Column
            location: St. Louis, Missouri, United States
            units: imperial

          - type: clock
            title: Clock
            hour-format: 12h

      - size: full
        widgets:
          - type: hacker-news
            title: Full Column
            limit: 10
            collapse-after: 5

  # ---------------------------------------------------------------------------
  # Group, nested group, and stack
  # ---------------------------------------------------------------------------
  - name: Groups & Stack
    slug: groups-stack
    width: wide

    columns:
      - size: full
        widgets:
          - type: group
            title: Stack Group
            widgets:
              - type: stack
                title: News Stack
                widgets:
                  - type: hacker-news
                    title: Hacker News
                    limit: 5
                    collapse-after: 5

                  - type: lobsters
                    title: Lobsters
                    limit: 5
                    collapse-after: 5

              - type: stack
                title: Community Stack
                widgets:
                  - type: reddit
                    title: Self Hosted
                    subreddit: selfhosted
                    limit: 5
                    collapse-after: 5

                  - type: reddit
                    title: Home Lab
                    subreddit: homelab
                    limit: 5
                    collapse-after: 5

      - size: full
        widgets:
          - type: group
            title: Nested Groups
            widgets:
              - type: group
                title: News
                widgets:
                  - type: hacker-news
                    title: Hacker News
                    limit: 5
                    collapse-after: 5

                  - type: lobsters
                    title: Lobsters
                    limit: 5
                    collapse-after: 5

              - type: group
                title: Communities
                widgets:
                  - type: reddit
                    title: Self Hosted
                    subreddit: selfhosted
                    limit: 5
                    collapse-after: 5

                  - type: reddit
                    title: Home Lab
                    subreddit: homelab
                    limit: 5
                    collapse-after: 5

  # ---------------------------------------------------------------------------
  # Timer responsive layouts
  # ---------------------------------------------------------------------------
  - name: Timer Small
    slug: timer-small
    width: wide

    columns:
      - size: small
        widgets:
          - type: timer
            title: Small Timer
            id: screenshot-timers-small
            hour-format: 12h

      - size: full
        widgets:
          - type: markdown
            title: Small Column Test
            source: |
              ## Timer Responsive Test

              The Timer in the small column verifies the narrowest supported
              desktop column layout.

      - size: small
        widgets:
          - type: bookmarks
            title: Test Links
            groups:
              - title: Examples
                links:
                  - title: GitHub
                    url: https://github.com/

  - name: Timer Medium + Full
    slug: timer-medium-full
    width: wide

    columns:
      - size: medium
        widgets:
          - type: timer
            title: Medium Timer
            id: screenshot-timers-medium
            hour-format: 12h

      - size: full
        widgets:
          - type: timer
            title: Full Timer
            id: screenshot-timers-full
            hour-format: 12h

  # ---------------------------------------------------------------------------
  # Fork widgets
  # ---------------------------------------------------------------------------
  - name: Widgets
    slug: widgets
    width: wide

    columns:
      - size: medium
        widgets:
          - type: analog-clock
            title: Analog Clock
            hide-am-pm-indicator: false
            hide-date: false
            dial-markers: NumericalFull
            timezones:
              - timezone: America/New_York
                label: New York
              - timezone: Europe/London
                label: London

          - type: search
            title: Search
            search-engine: google
            autofocus: false

          - type: unit-converter
            title: Unit Converter

          - type: calculator
            title: Calculator

      - size: medium
        widgets:
          - type: timer
            title: Timers
            id: screenshot-timers
            hour-format: 12h

          - type: markdown
            title: Markdown
            source: |
              ## Native Markdown

              This content is rendered **directly by Glance**.

              - GitHub Flavored Markdown
              - **Bold** and *italic* text
              - [Links](https://github.com/glanceapp/glance)
              - ~~Strikethrough~~

              | Feature | Status |
              | --- | --- |
              | Markdown | Working |
              | Sanitization | Enabled |

      - size: medium
        widgets:
          - type: ics-events
            title: Upcoming Events
            days-ahead: 14
            limit: 8
            collapse-after: 5
            sources:
              - file: testdata/screenshot-calendar.ics
                title: Example Calendar

  # ---------------------------------------------------------------------------
  # Request-oriented widgets
  # ---------------------------------------------------------------------------
  #
  # These examples use public, test-safe endpoints and explicitly override
  # inherited credentials where the public endpoint does not require them.
  #
  # They provide integration coverage for the request policy added or
  # significantly expanded by the fork without depending on private services.
  - name: Requests
    slug: requests
    width: wide

    columns:
      - size: medium
        widgets:
          - type: custom-api
            title: Custom API
            url: https://api.github.com/repos/samcro1967/glance
            basic-auth:
              username: ""
              password: ""
            headers:
              Accept: application/vnd.github+json
              X-Glance-Test-Instance: custom-api
            template: |
              <div class="flex flex-column gap-5">
                <div class="size-h4 color-highlight">
                  {{ .JSON.String "full_name" }}
                </div>
                <div>
                  {{ .JSON.String "description" }}
                </div>
                <div class="color-subdue">
                  Stars: {{ .JSON.Int "stargazers_count" | formatNumber }}
                </div>
              </div>


      - size: medium
        widgets:
          - type: monitor
            title: Public Monitors
            sites:
              - title: GitHub
                url: https://github.com/
                basic-auth:
                  username: ""
                  password: ""

              - title: Glance
                url: https://github.com/glanceapp/glance
                timeout: 8s
                allow-insecure: false
                headers:
                  X-Glance-Test-Child: monitor
                basic-auth:
                  username: ""
                  password: ""
                same-tab: true

          - type: repository
            title: Glance Repository
            repository: glanceapp/glance

      - size: medium
        widgets:
          - type: bookmarks
            title: Link Policy
            groups:
              - title: Inherited Link Policy
                links:
                  - title: Glance Fork
                    url: https://github.com/samcro1967/glance

              - title: Explicit Same Tab
                same-tab: true
                links:
                  - title: Upstream Glance
                    url: https://github.com/glanceapp/glance

  # ---------------------------------------------------------------------------
  # Pages used to demonstrate named dashboards and the dashboard switcher.
  # ---------------------------------------------------------------------------
  - name: Home
    slug: home

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Default Dashboard
            source: |
              ## Default Dashboard

              Use the Glance logo to switch between the configured dashboards.

  - name: Personal
    slug: personal-page

    columns:
      - size: full
        widgets:
          - type: bookmarks
            title: Personal
            groups:
              - title: Common Sites
                links:
                  - title: GitHub
                    url: https://github.com/
                  - title: Wikipedia
                    url: https://en.wikipedia.org/
                  - title: YouTube
                    url: https://www.youtube.com/

  - name: Shared
    slug: shared

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Shared Page
            source: |
              ## Shared Page

              This page is configured once and is available from multiple
              named dashboards.

dashboards:
  Default:
    - defaults
    - status-bar
    - layout
    - proportional
    - groups-stack
    - widgets
    - requests
    - timer-small
    - timer-medium-full
    - home
    - shared

  Personal:
    - home
    - personal-page
    - shared

  Documentation:
    - defaults
    - status-bar
    - layout
    - groups-stack
    - widgets
    - requests
    - timer-small
    - timer-medium-full
    - shared
