  - name: Home
    slug: home
    theme:
      accent-color: 204 100 72
      page:
        ambient-accent: strong

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Default Dashboard
            source: |
              ## Default Dashboard

              Use the Glance logo to switch between the configured dashboards.

  - name: Personal
    slug: personal-page
    theme:
      accent-color: 350 100 72

    columns:
      - size: full
        widgets:
          - type: bookmarks
            title: Personal
            groups:
              - title: Common Sites
                links:
                  - title: GitHub
                    url: https://github.com/
                  - title: Wikipedia
                    url: https://en.wikipedia.org/
                  - title: YouTube
                    url: https://www.youtube.com/

  - name: Shared
    slug: shared
    theme:
      accent-color: 40 74 63

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Shared Page
            source: |
