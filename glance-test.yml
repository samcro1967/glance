# Canonical configuration for the local Glance development test instance.
#
# This file is intentionally committed to the repository. Keep its contents
# public and test-safe. Do not add credentials, tokens, private URLs, or other
# environment-specific secrets.
#
# Representative fork features and hierarchical configuration behavior are
# collected on dedicated pages so this dashboard provides a repeatable source
# for local integration testing and documentation screenshots.

server:
  host: 0.0.0.0
  port: 18080
  assets-path: testdata/assets
  frontend-diagnostics: true

branding:
  app-name: "Glance Test"

footer-micro-widgets:
  max-per-side: 5
  left:
    - type: bookmark
      position: 1
      title: "GitHub"
      url: https://github.com/samcro1967/glance
      icon: si:github
    - type: weather
      position: 2
      location: "St. Louis, Missouri"
      units: imperial
      show-area-name: false
      url: https://weather.example/st-louis
      same-tab: true
    - type: link
      position: 3
      title: "Glance Docs"
      url: https://github.com/samcro1967/glance/tree/main/docs
      same-tab: true
    - type: docker
      position: 4
      container: Glance
      sock-path: http://127.0.0.1:18089
  right:
    - type: clock
      position: 1
      hour-format: 12h
      label: "Local"
    - type: markets
      position: 2
      markets:
        - symbol: SPY
    - type: monitor
      position: 3
      sites:
        - title: "Example"
          url: https://example.com
    - type: clock
      position: 4
      hour-format: 24h
      timezone: America/New_York
      label: "NY"
    - type: docker
      position: 5
      summary: true
      sock-path: http://127.0.0.1:18089

$include: testdata/expanded-theme.yml

# ---------------------------------------------------------------------------
# Hierarchical widget defaults
# ---------------------------------------------------------------------------
#
# This intentionally exercises the supported inheritance model:
#
#   built-in default
#       -> global default
#       -> widget-type default
#       -> widget instance
#       -> child/source override
#
# Global defaults exercise every common capability and the generic HTTP
# capabilities that are valid at global scope. Type defaults exercise the
# reusable list and HTTP capability families. Widgets below contain selected
# explicit overrides so the test instance covers precedence as well as simple
# inheritance.
#
# Some presentation defaults are intentionally obvious so inheritance can be
# verified visually. Individual widgets override them where appropriate.

widget-defaults:
  global:
    title: "Inherited Widget Title"
    title-url: https://github.com/samcro1967/glance
    hide-header: false
    css-class: test-default-global
    cache: 30m
    new-tab: true
    timeout: 10s
    allow-insecure: false
    headers:
      X-Glance-Test: global

  types:
    rss:
      icon: mdi:rss
      title: "Inherited RSS"
      cache: 15m
      new-tab: false
      limit: 6
      collapse-after: 4
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: rss
      basic-auth:
        username: glance-test
        password: glance-test

    monitor:
      icon: mdi:monitor
      title: "Inherited Monitor"
      cache: 1m
      new-tab: false
      timeout: 5s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: monitor
      basic-auth:
        username: glance-test
        password: glance-test

    hacker-news:
      icon: si:ycombinator
      title: "Inherited Hacker News"
      limit: 6
      collapse-after: 4
      new-tab: false

    lobsters:
      icon: mdi:rss
      title: "Inherited Lobsters"
      limit: 6
      collapse-after: 4
      new-tab: false

    reddit:
      icon: si:reddit
      title: "Inherited Reddit"
      limit: 6
      collapse-after: 4
      new-tab: false

    releases:
      icon: si:github
      title: "Inherited Releases"
      limit: 6
      collapse-after: 4
      new-tab: false

    videos:
      icon: mdi:video
      title: "Inherited Videos"
      limit: 8
      collapse-after: 6
      collapse-after-rows: 2
      new-tab: false

    twitch-top-games:
      icon: si:twitch
      title: "Inherited Twitch Games"
      limit: 8
      collapse-after: 5
      new-tab: false

    twitch-channels:
      icon: si:twitch
      title: "Inherited Twitch Channels"
      collapse-after: 5
      new-tab: false

    ics-events:
      icon: mdi:calendar
      title: "Inherited ICS Events"
      limit: 6
      collapse-after: 4
      new-tab: false
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: ics
      basic-auth:
        username: glance-test
        password: glance-test

    custom-api:
      icon: si:json
      title: "Inherited Custom API"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: custom-api
      basic-auth:
        username: glance-test
        password: glance-test

    extension:
      icon: di:glance
      title: "Inherited Extension"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: extension
      basic-auth:
        username: glance-test
        password: glance-test

    markets:
      icon: mdi:chart-line
      title: "Inherited Markets"
      new-tab: false

    stocks:
      icon: mdi:chart-line
      title: "Inherited Stocks Alias"
      new-tab: true

    repository:
      icon: si:github
      title: "Inherited Repository"
      new-tab: false

    search:
      icon: mdi:magnify
      title: "Inherited Search"
      new-tab: false

    bookmarks:
      icon: mdi:bookmark-multiple
      title: "Inherited Bookmarks"
      new-tab: false

    analog-clock:
      icon: mdi:clock-outline

    calculator:
      icon: mdi:calculator

    calendar:
      icon: mdi:calendar

    calendar-legacy:
      icon: mdi:calendar-clock

    change-detection:
      icon: mdi:radar

    clock:
      icon: mdi:clock

    dns-stats:
      icon: si:adguard

    docker-containers:
      icon: mdi:docker

    iframe:
      icon: mdi:web

    server-stats:
      icon: mdi:server

    timer:
      icon: mdi:timer-outline

    to-do:
      icon: mdi:checkbox-marked-outline

    unit-converter:
      icon: mdi:swap-horizontal

    weather:
      icon: mdi:weather-partly-cloudy

pages:
  - name: Layout & Composition
    icon: mdi:view-dashboard
    slug: layout-composition
    width: wide
    head-widgets:
      - type: status-bar
        title: Status Bar - Ticker
        css-class: visual-fixture-status-bar
        mode: ticker
        speed: normal
        widgets:
          - type: weather
            location: St. Louis, Missouri, United States
            units: imperial
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin

    columns:
      - size: small
        widgets:
          - type: group
            title: Group
            css-class: visual-fixture-group
            widgets:
              - type: hacker-news
                title: Hacker News
                limit: 5
                collapse-after: 3
              - type: lobsters
                title: Lobsters
                limit: 5
                collapse-after: 3

          - type: stack
            title: Stack
            css-class: visual-fixture-stack
            widgets:
              - type: markdown
                title: First
                source: |
                  **Stacked content** with secondary information.
              - type: bookmarks
                title: Second
                groups:
                  - title: Links
                    links:
                      - title: Glance
                        url: https://github.com/samcro1967/glance

      - size: full
        widgets:
          - type: split-column
            title: Split Column
            css-class: visual-fixture-split-column
            max-columns: 3
            widgets:
              - type: hacker-news
                title: Hacker News
                limit: 6
                collapse-after: 4
              - type: reddit
                title: Self Hosted
                subreddit: selfhosted
                limit: 6
                collapse-after: 4
              - type: lobsters
                title: Lobsters
                limit: 6
                collapse-after: 4

      - size: small
        widgets:
          - type: group
            title: Nested Group
            widgets:
              - type: stack
                title: Information
                widgets:
                  - type: clock
                    hour-format: 12h
                  - type: markdown
                    source: Nested composition
              - type: markdown
                title: Alternate
                source: Second tab

    bottom-widgets:
      - type: status-bar
        title: Status Bar - Wrap
        mode: wrap
        widgets:
          - type: markets
            markets:
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft
          - type: weather
            location: St. Louis, Missouri, United States
            units: imperial

  - name: Feeds & Content
    icon: mdi:rss
    slug: feeds-content
    width: wide
    columns:
      - size: small
        widgets:
          - type: hacker-news
            title: Hacker News
            css-class: visual-fixture-hacker-news
            limit: 8
            collapse-after: 5

          - type: lobsters
            title: Lobsters
            css-class: visual-fixture-lobsters
            limit: 8
            collapse-after: 5

      - size: full
        widgets:
          - type: rss
            title: RSS - Horizontal Cards
            css-class: visual-fixture-rss
            style: horizontal-cards
            limit: 8
            collapse-after: 6
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st

          - type: videos
            title: Videos - Grid Cards
            css-class: visual-fixture-videos
            style: grid-cards
            collapse-after-rows: 2
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw
              - UCR-DXc1voovS8nhAvccRZhg
              - UCsBjURrPoezykLs9EqgamOA

          - type: reddit
            title: Reddit - Horizontal Cards
            css-class: visual-fixture-reddit
            subreddit: selfhosted
            style: horizontal-cards
            limit: 8
            collapse-after: 6

      - size: small
        widgets:
          - type: rss
            title: RSS - List
            limit: 8
            collapse-after: 5
            feeds:
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau

          - type: reddit
            title: Reddit - Vertical
            subreddit: homelab
            limit: 8
            collapse-after: 5

  - name: Search, Links & Custom Content
    icon: mdi:magnify
    slug: search-custom-content
    width: wide
    columns:
      - size: small
        widgets:
          - type: search
            title: Search
            css-class: visual-fixture-search
            search-engine: google
            autofocus: false
            bangs:
              - title: GitHub
                shortcut: "!gh"
                url: https://github.com/search?q={QUERY}

          - type: bookmarks
            title: Bookmarks
            css-class: visual-fixture-bookmarks
            groups:
              - title: Development
                links:
                  - title: Glance
                    url: https://github.com/glanceapp/glance
                  - title: Fork
                    url: https://github.com/samcro1967/glance
              - title: Reference
                links:
                  - title: Go
                    url: https://go.dev/

      - size: full
        widgets:
          - type: custom-api
            title: Custom API - Native Presentation
            css-class: visual-fixture-custom-api
            url: http://127.0.0.1:18089/custom-api-presentation
            cache: 1h
            tables:
              services:
                responsive: true
                sortable: true
                search: false
                pagination: false
                columns:
                  service:
                    type: text
                    priority: 1
                  status:
                    type: text
                    priority: 2
                  latency:
                    type: number
                    priority: 3
            charts:
              resources:
                type: line
                height: 180
                legend: true
                min: 0
                max: 100
                unit: "%"
            template: |
              <div class="glance-grid">
                <div class="glance-card">
                  <div class="glance-secondary">Repository</div>
                  <div class="size-h3 color-highlight">{{ .JSON.String "full_name" }}</div>
                  <div class="glance-muted">{{ .JSON.String "description" }}</div>
                </div>
                <div class="glance-card">
                  <div class="glance-secondary">Stars</div>
                  <div class="size-h2 color-highlight">{{ .JSON.Int "stargazers_count" | formatNumber }}</div>
                  <span class="glance-badge">Local fixture</span>
                </div>
              </div>
              <table class="glance-table margin-top-10" data-glance-table="services">
                <thead>
                  <tr>
                    <th data-column="service">Service</th>
                    <th data-column="status">Status</th>
                    <th data-column="latency">Latency</th>
                  </tr>
                </thead>
                <tbody>
                  {{ range .JSON.Array "services" }}
                    <tr>
                      <td>{{ .String "name" }}</td>
                      <td>{{ .String "status" }}</td>
                      <td>{{ .Int "latency" }} ms</td>
                    </tr>
                  {{ end }}
                </tbody>
              </table>
              <div class="glance-chart margin-top-10" data-glance-chart="resources" data-glance-chart-label="Resource usage">
                <script type="application/json">{{ .JSON.String "chart" }}</script>
              </div>

          - type: markdown
            title: Markdown
            css-class: visual-fixture-markdown
            source: |
              ## Presentation hierarchy

              Markdown verifies **headings**, body copy, [links](https://github.com/samcro1967/glance), lists, code, and separators.

              - Primary information
              - Secondary information
              - Metadata and supporting detail

              `inline code` should remain legible in every theme.

          - type: html
            title: HTML
            css-class: visual-fixture-html
            source: |
              <div class="glance-card visual-fixture-html-content">
                <div class="size-h3 color-highlight">Trusted HTML</div>
                <p class="glance-secondary">Semantic presentation inside the native HTML widget.</p>
                <span class="glance-badge">HTML</span>
              </div>

      - size: small
        widgets:
          - type: extension
            title: Extension
            css-class: visual-fixture-extension
            url: http://127.0.0.1:18089/visual-test-extension
            timeout: 1s
            allow-potentially-dangerous-html: true

          - type: iframe
            title: IFrame
            css-class: visual-fixture-iframe
            source: https://example.com/
            height: 240

  - name: Date, Time & Weather
    icon: mdi:weather-partly-cloudy
    slug: date-time-weather
    width: wide
    columns:
      - size: small
        widgets:
          - type: clock
            title: Clock
            css-class: visual-fixture-clock
            hour-format: 12h
            timezones:
              - timezone: America/Chicago
                label: Chicago
              - timezone: Europe/London
                label: London
              - timezone: Asia/Tokyo
                label: Tokyo

          - type: analog-clock
            title: Analog Clock
            css-class: visual-fixture-analog-clock
            dial-markers: NumericalFull
            timezones:
              - timezone: America/New_York
                label: New York

          - type: timer
            title: Timer
            css-class: visual-fixture-timer
            id: visual-qa-timer
            hour-format: 12h

      - size: full
        widgets:
          - type: calendar
            title: Calendar
            css-class: visual-fixture-calendar
            first-day-of-week: sunday
            sources:
              - file: testdata/screenshot-calendar.ics
                title: Visual QA

          - type: ics-events
            title: ICS Events
            css-class: visual-fixture-ics-events
            days-ahead: 45
            limit: 10
            collapse-after: 6
            sources:
              - file: testdata/screenshot-calendar.ics
                title: Visual QA

      - size: small
        widgets:
          - type: weather
            title: Weather
            css-class: visual-fixture-weather
            location: St. Louis, Missouri, United States
            units: imperial
            hour-format: 12h
            show-current: true
            show-details: true
            show-hourly: true
            show-forecast: true

          - type: calendar-legacy
            title: Calendar Legacy
            css-class: visual-fixture-calendar-legacy
            start-sunday: true

  - name: Homelab & Monitoring
    icon: mdi:server
    slug: homelab-monitoring
    width: wide
    columns:
      - size: medium
        widgets:
          - type: monitor
            title: Monitor
            css-class: visual-fixture-monitor
            cache: 5m
            sites:
              - title: GitHub
                url: https://github.com/
              - title: Glance
                url: https://github.com/samcro1967/glance

          - type: docker-containers
            title: Docker Containers
            css-class: visual-fixture-docker-containers
            sock-path: http://127.0.0.1:18089
            hide-by-default: false

      - size: medium
        widgets:
          - type: server-stats
            title: Server Stats
            css-class: visual-fixture-server-stats
            servers:
              - type: local
                name: Local Test Instance

          - type: dns-stats
            title: DNS Stats
            css-class: visual-fixture-dns-stats
            service: adguard
            url: http://127.0.0.1:18089/
            timeout: 1s

      - size: medium
        widgets:
          - type: change-detection
            title: ChangeDetection.io
            css-class: visual-fixture-change-detection
            instance-url: http://127.0.0.1:18089
            timeout: 1s
            limit: 6
            collapse-after: 4

          - type: markdown
            title: Deterministic fixture coverage
            source: |
              Monitoring widgets use local deterministic fixture data for reproducible visual QA.

  - name: Development & Releases
    icon: si:github
    slug: development-releases
    width: wide
    columns:
      - size: medium
        widgets:
          - type: repository
            title: Repository
            css-class: visual-fixture-repository
            repository: samcro1967/glance

      - size: full
        widgets:
          - type: releases
            title: Releases
            css-class: visual-fixture-releases
            repositories:
              - glanceapp/glance
              - samcro1967/glance
              - immich-app/immich
              - syncthing/syncthing

  - name: Markets & Streaming
    icon: mdi:chart-line
    slug: markets-streaming
    width: wide
    columns:
      - size: medium
        widgets:
          - type: markets
            title: Markets
            css-class: visual-fixture-markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: AAPL
                name: Apple

          - type: stocks
            title: Stocks Compatibility Alias
            css-class: visual-fixture-stocks
            markets:
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: NVIDIA

      - size: full
        widgets:
          - type: twitch-channels
            title: Twitch Channels
            css-class: visual-fixture-twitch-channels
            channels:
              - cohhcarnage
              - lirik

          - type: twitch-top-games
            title: Twitch Top Games
            css-class: visual-fixture-twitch-top-games
            limit: 10
            collapse-after: 6
            exclude:
              - just-chatting
              - pools-hot-tubs-and-beaches

  - name: Utilities
    icon: mdi:tools
    slug: utilities
    width: wide
    columns:
      - size: medium
        widgets:
          - type: to-do
            title: To-do
            css-class: visual-fixture-to-do
            id: visual-qa-todo

      - size: medium
        widgets:
          - type: unit-converter
            title: Unit Converter
            css-class: visual-fixture-unit-converter

      - size: medium
        widgets:
          - type: calculator
            title: Calculator
            css-class: visual-fixture-calculator

  - name: Theme Global
    icon: mdi:palette
    slug: theme-global
    width: wide
    columns:
      - size: medium
        widgets:
          - type: markdown
            title: Global Theme
            source: |
              ## Global semantic theme

              This page inherits the complete theme from `testdata/expanded-theme.yml`.

          - type: group
            title: Groups & Tabs
            widgets:
              - type: markdown
                title: Selected
                source: Selected tab content
              - type: markdown
                title: Alternate
                source: Alternate tab content

      - size: medium
        widgets:
          - type: search
            title: Search
            search-engine: google
            autofocus: false

          - type: unit-converter
            title: Unit Converter

      - size: medium
        widgets:
          - type: timer
            title: Timer
            id: visual-theme-global-timer
            hour-format: 12h

          - type: calculator
            title: Calculator

          - type: bookmarks
            title: Bookmarks
            groups:
              - title: Theme Links
                links:
                  - title: Glance
                    url: https://github.com/samcro1967/glance

  - name: Theme Dark Page
    icon: mdi:weather-night
    slug: theme-dark-page
    width: wide
    theme:
      light: false
      background-color: 230 24 7
      primary-color: 210 80 70
      accent-color: 272 82 72
      typography:
        text-color: 220 18 92
        secondary-text-color: 220 11 68
        muted-text-color: 220 9 48
        headings:
          text-color: 220 20 96
      widget-header:
        text-color: 220 18 93
      widgets:
        background-color: 225 20 12
        border-color: 225 12 18
        radius: large
        shadow: subtle
      cards:
        background-color: 225 18 15
        border-color: 225 12 21
        radius: large
      groups:
        background-color: 225 20 12
        text-color: 220 11 68
        hover-color: 220 18 92
        active-color: 220 20 96
        accent-color: 272 82 72
        border-color: 225 12 20
      controls:
        background-color: 225 18 15
        text-color: 220 18 92
        muted-color: 220 9 48
        border-color: 225 12 22
        focus-color: 272 82 72
        radius: large

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Dark Page
            source: |
              ## Explicit dark page theme

              Page-level semantic values override the inherited global theme.

          - type: group
            title: Dark Tabs
            widgets:
              - type: markdown
                title: Selected
                source: Selected content
              - type: markdown
                title: Alternate
                source: Alternate content

          - type: search
            title: Dark Controls
            search-engine: google
            autofocus: false

  - name: Theme Light Page
    icon: mdi:white-balance-sunny
    slug: theme-light-page
    width: wide
    theme:
      light: true
      background-color: 220 24 96
      primary-color: 214 70 46
      accent-color: 268 68 54
      typography:
        text-color: 220 18 16
        secondary-text-color: 220 10 38
        muted-text-color: 220 8 52
        headings:
          text-color: 220 20 12
      widget-header:
        text-color: 220 18 14
      widgets:
        background-color: 0 0 100
        border-color: 220 14 86
        radius: large
        shadow: subtle
      cards:
        background-color: 220 20 98
        border-color: 220 14 84
        radius: large
      groups:
        background-color: 0 0 100
        text-color: 220 10 38
        hover-color: 220 18 18
        active-color: 220 20 12
        accent-color: 268 68 54
        border-color: 220 14 84
      controls:
        background-color: 220 20 98
        text-color: 220 18 16
        muted-color: 220 8 52
        border-color: 220 14 82
        focus-color: 268 68 54
        radius: large

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Light Page
            source: |
              ## Explicit light page theme

              The component language remains the same while the palette changes.

          - type: group
            title: Light Tabs
            widgets:
              - type: markdown
                title: Selected
                source: Selected content
              - type: markdown
                title: Alternate
                source: Alternate content

          - type: search
            title: Light Controls
            search-engine: google
            autofocus: false

  - name: Theme Partial Override
    icon: mdi:palette-outline
    slug: theme-partial
    width: wide
    theme:
      accent-color: 32 90 60
      navigation:
        accent-color: 32 90 60
      groups:
        accent-color: 32 90 60
      controls:
        focus-color: 32 90 60

    columns:
      - size: full
        widgets:
          - type: markdown
            title: Partial Override
            source: |
              ## Inheritance check

              Only accent and focus semantics change. Everything else inherits.

          - type: group
            title: Inherited Group
            widgets:
              - type: markdown
                title: Selected
                source: Accent override
              - type: markdown
                title: Alternate
                source: Inherited presentation

          - type: search
            title: Inherited Control
            search-engine: google
            autofocus: false

  - name: Theme Components
    icon: mdi:view-grid
    slug: theme-components
    width: wide
    theme:
      custom-css-file: /assets/theme-page.css
      header:
        shadow: none
      widgets:
        shadow: none
      widget-header:
