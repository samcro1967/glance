# Canonical configuration for the local Glance development test instance.
#
# This file is intentionally committed to the repository. Keep its contents
# public and test-safe. Do not add credentials, tokens, private URLs, or other
# environment-specific secrets.
#
# Representative fork features and hierarchical configuration behavior are
# collected on dedicated pages so this dashboard provides a repeatable source
# for local integration testing and documentation screenshots.

server:
  host: 0.0.0.0
  port: 18080

branding:
  app-name: "Glance Test"

$include: testdata/expanded-theme.yml

# ---------------------------------------------------------------------------
# Hierarchical widget defaults
# ---------------------------------------------------------------------------
#
# This intentionally exercises the supported inheritance model:
#
#   built-in default
#       -> global default
#       -> widget-type default
#       -> widget instance
#       -> child/source override
#
# Global defaults exercise every common capability and the generic HTTP
# capabilities that are valid at global scope. Type defaults exercise the
# reusable list and HTTP capability families. Widgets below contain selected
# explicit overrides so the test instance covers precedence as well as simple
# inheritance.
#
# Some presentation defaults are intentionally obvious so inheritance can be
# verified visually. Individual widgets override them where appropriate.

widget-defaults:
  global:
    title: "Inherited Widget Title"
    title-url: https://github.com/samcro1967/glance
    hide-header: false
    css-class: test-default-global
    cache: 30m
    new-tab: true
    timeout: 10s
    allow-insecure: false
    headers:
      X-Glance-Test: global

  types:
    rss:
      title: "Inherited RSS"
      cache: 15m
      new-tab: false
      limit: 6
      collapse-after: 4
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: rss
      basic-auth:
        username: glance-test
        password: glance-test

    monitor:
      title: "Inherited Monitor"
      cache: 1m
      new-tab: false
      timeout: 5s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: monitor
      basic-auth:
        username: glance-test
        password: glance-test

    hacker-news:
      title: "Inherited Hacker News"
      limit: 6
      collapse-after: 4
      new-tab: false

    lobsters:
      title: "Inherited Lobsters"
      limit: 6
      collapse-after: 4
      new-tab: false

    reddit:
      title: "Inherited Reddit"
      limit: 6
      collapse-after: 4
      new-tab: false

    releases:
      title: "Inherited Releases"
      limit: 6
      collapse-after: 4
      new-tab: false

    videos:
      title: "Inherited Videos"
      limit: 8
      collapse-after: 6
      collapse-after-rows: 2
      new-tab: false

    twitch-top-games:
      title: "Inherited Twitch Games"
      limit: 8
      collapse-after: 5
      new-tab: false

    twitch-channels:
      title: "Inherited Twitch Channels"
      collapse-after: 5
      new-tab: false

    ics-events:
      title: "Inherited ICS Events"
      limit: 6
      collapse-after: 4
      new-tab: false
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: ics
      basic-auth:
        username: glance-test
        password: glance-test

    custom-api:
      title: "Inherited Custom API"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: custom-api
      basic-auth:
        username: glance-test
        password: glance-test

    extension:
      title: "Inherited Extension"
      cache: 15m
      timeout: 8s
      allow-insecure: false
      headers:
        X-Glance-Test-Type: extension
      basic-auth:
        username: glance-test
        password: glance-test

    markets:
      title: "Inherited Markets"
      new-tab: false

    stocks:
      title: "Inherited Stocks Alias"
      new-tab: true

    repository:
      title: "Inherited Repository"
      new-tab: false

    search:
      title: "Inherited Search"
      new-tab: false

    bookmarks:
      title: "Inherited Bookmarks"
      new-tab: false

pages:
  # ---------------------------------------------------------------------------
  # Hierarchical defaults integration
  # ---------------------------------------------------------------------------
  - name: Defaults
    slug: defaults
    width: wide

    columns:
      - size: medium
        widgets:
          # Exercises RSS type defaults and child/source inheritance.
          #
          # The first feed inherits type HTTP defaults. The second feed
          # explicitly overrides child-capable values, proving the most
          # specific configured value wins.
          - type: rss
            title: RSS Instance Override
            cache: 20m
            feeds:
              - url: https://selfh.st/rss/
                title: Inherited Feed

              - url: https://www.joshwcomeau.com/rss.xml
                title: Explicit Feed Override
                limit: 2
                timeout: 12s
                allow-insecure: false
                headers:
                  X-Glance-Test-Child: rss
                basic-auth:
                  username: ""
                  password: ""

          # Common capabilities apply recursively through containers.
          - type: group
            title: Nested Defaults
            widgets:
              - type: hacker-news

              - type: stack
                title: Nested Stack
                widgets:
                  - type: lobsters

                  - type: reddit
                    subreddit: selfhosted

      - size: medium
        widgets:
          # Exercises list type defaults with an explicit instance override.
          - type: hacker-news
            title: Hacker News Instance Override
            limit: 3
            collapse-after: 2

          - type: releases
            repositories:
              - glanceapp/glance
              - samcro1967/glance
              - immich-app/immich
              - syncthing/syncthing

          - type: videos
            style: grid-cards
            channels:
              - UCXuqSBlHAE6Xw-yeJA0Tunw
              - UCR-DXc1voovS8nhAvccRZhg
              - UCsBjURrPoezykLs9EqgamOA

      - size: medium
        widgets:
          # Exercises common title/title-url/new-tab behavior.
          - type: weather
            title: Weather Instance Override
            title-url: https://open-meteo.com/
            location: St. Louis, Missouri, United States
            units: imperial
            show-current: true
            show-details: true
            show-hourly: true
            show-forecast: true

          # markets and stocks intentionally have different type defaults even
          # though both resolve to the same implementation.
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: AAPL
                name: Apple

          - type: stocks
            markets:
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: NVIDIA

  # ---------------------------------------------------------------------------
  # Status Bar
  # ---------------------------------------------------------------------------
  - name: Status Bar
    slug: status-bar
    width: wide

    head-widgets:
      - type: status-bar
        title: Status Bar Ticker
        mode: ticker
        speed: normal
        widgets:
          - type: weather
            title: Weather
            location: St. Louis, Missouri, United States
            units: imperial

          - type: markets
            title: Markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft
              - symbol: NVDA
                name: NVIDIA

          - type: rss
            title: RSS
            limit: 5
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                basic-auth:
                  username: ""
                  password: ""

          # Status Bar Custom API uses a locked compact response contract.
          # Enable when a compatible endpoint is available.
          # - type: custom-api
          #   title: Live Scores
          #   url: https://example.com/status.json
          #   cache: 1m
          # Expected response has an items array with icon1, url, line1, line2, and icon2.

    columns:
      - size: full
        widgets:
          - type: hacker-news
            title: Technology News
            limit: 5
            collapse-after: 5

    bottom-widgets:
      # Short ticker intentionally uses the same speed as the much longer
      # head ticker. They should move at the same visual pixels-per-second
      # rate despite having very different content widths.
      - type: status-bar
        title: Status Bar Short Ticker
        mode: ticker
        speed: normal
        widgets:
          - type: markets
            title: Markets
            markets:
              - symbol: SPY
                name: S&P 500

      - type: status-bar
        title: Status Bar Wrap
        mode: wrap
        widgets:
          - type: weather
            title: Weather
            location: St. Louis, Missouri, United States
            units: imperial

          - type: markets
            title: Markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

          - type: rss
            title: RSS
            limit: 3
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
                basic-auth:
                  username: ""
                  password: ""

  # ---------------------------------------------------------------------------
  # Layout features
  # ---------------------------------------------------------------------------
  - name: Layout
    slug: layout
    theme:
      accent-color: 37 84 65
    width: wide

    columns:
      - size: medium
        widgets:
          - type: weather
            title: First Medium Column
            location: St. Louis, Missouri, United States
            units: imperial

      - size: medium
        widgets:
          - type: hacker-news
            title: Second Medium Column
            limit: 5
            collapse-after: 5

      - size: medium
        widgets:
          - type: reddit
            title: Third Medium Column
            subreddit: selfhosted
            limit: 5
            collapse-after: 5

    bottom-widgets:
      - type: rss
        title: Bottom Widgets
        style: horizontal-cards
        limit: 5
        feeds:
          - url: https://selfh.st/rss/
            title: selfh.st
            basic-auth:
              username: ""
              password: ""

  # ---------------------------------------------------------------------------
  # Medium + Full proportional layout
  # ---------------------------------------------------------------------------
  - name: Proportional
    slug: proportional
    width: wide

    columns:
      - size: medium
        widgets:
          - type: weather
            title: Medium Column
            location: St. Louis, Missouri, United States
            units: imperial

          - type: clock
            title: Clock
            hour-format: 12h

      - size: full
        widgets:
          - type: hacker-news
            title: Full Column
            limit: 10
            collapse-after: 5

  # ---------------------------------------------------------------------------
  # Group, nested group, and stack
  # ---------------------------------------------------------------------------
  - name: Groups & Stack
    slug: groups-stack
    theme:
      accent-color: 135 60 63
      groups:
        active-color: 145 65 82
    width: wide

    columns:
      - size: full
        widgets:
          - type: group
            title: Stack Group
            widgets:
              - type: stack
                title: News Stack
                widgets:
                  - type: hacker-news
                    title: Hacker News
                    limit: 5
                    collapse-after: 5

                  - type: lobsters
                    title: Lobsters
                    limit: 5
                    collapse-after: 5

              - type: stack
                title: Community Stack
                widgets:
                  - type: reddit
                    title: Self Hosted
                    subreddit: selfhosted
                    limit: 5
                    collapse-after: 5

                  - type: reddit
                    title: Home Lab
                    subreddit: homelab
                    limit: 5
                    collapse-after: 5

      - size: full
        widgets:
          - type: group
            title: Nested Groups
            widgets:
              - type: group
                title: News
                widgets:
                  - type: hacker-news
                    title: Hacker News
                    limit: 5
                    collapse-after: 5

                  - type: lobsters
                    title: Lobsters
                    limit: 5
                    collapse-after: 5

              - type: group
                title: Communities
                widgets:
                  - type: reddit
                    title: Self Hosted
                    subreddit: selfhosted
                    limit: 5
                    collapse-after: 5

                  - type: reddit
                    title: Home Lab
                    subreddit: homelab
                    limit: 5
                    collapse-after: 5

  # ---------------------------------------------------------------------------
  # Timer responsive layouts
  # ---------------------------------------------------------------------------
  - name: Timer Small
    slug: timer-small
    width: wide

    columns:
      - size: small
        widgets:
          - type: timer
            title: Small Timer
            id: screenshot-timers-small
            hour-format: 12h

      - size: full
        widgets:
          - type: markdown
            title: Small Column Test
            source: |
              ## Timer Responsive Test

              The Timer in the small column verifies the narrowest supported
              desktop column layout.

      - size: small
        widgets:
          - type: bookmarks
            title: Test Links
            groups:
              - title: Examples
                links:
                  - title: GitHub
                    url: https://github.com/

  - name: Timer Medium + Full
    slug: timer-medium-full
    width: wide

    columns:
      - size: medium
        widgets:
          - type: timer
            title: Medium Timer
            id: screenshot-timers-medium
            hour-format: 12h

      - size: full
        widgets:
          - type: timer
            title: Full Timer
            id: screenshot-timers-full
            hour-format: 12h

  # ---------------------------------------------------------------------------
  # Fork widgets
  # ---------------------------------------------------------------------------
  - name: Widgets
    slug: widgets
    theme:
      accent-color: 349 100 72
    width: wide

    columns:
      - size: medium
        widgets:
          - type: analog-clock
            title: Analog Clock
            hide-am-pm-indicator: false
            hide-date: false
            dial-markers: NumericalFull
            timezones:
              - timezone: America/New_York
                label: New York
              - timezone: Europe/London
                label: London

          - type: search
            title: Search
            search-engine: google
            autofocus: false

          - type: unit-converter
            title: Unit Converter

          - type: calculator
            title: Calculator

      - size: medium
        widgets:
          - type: timer
            title: Timers
            id: screenshot-timers
            hour-format: 12h

          - type: markdown
            title: Markdown
            source: |
              ## Native Markdown

              This content is rendered **directly by Glance**.

              - GitHub Flavored Markdown
              - **Bold** and *italic* text
              - [Links](https://github.com/glanceapp/glance)
              - ~~Strikethrough~~

              | Feature | Status |
              | --- | --- |
              | Markdown | Working |
              | Sanitization | Enabled |

      - size: medium
        widgets:
          - type: ics-events
            title: Upcoming Events
            days-ahead: 14
            limit: 8
            collapse-after: 5
            sources:
              - file: testdata/screenshot-calendar.ics
                title: Example Calendar

          - type: calendar
            title: Media Calendar
            first-day-of-week: monday
            sources:
              - url: ${RADARR_ICS_URL}
                title: Movies
              - url: ${SONARR_ICS_URL}
                title: TV

  # ---------------------------------------------------------------------------
  # Request-oriented widgets
  # ---------------------------------------------------------------------------
  #
  # These examples use public, test-safe endpoints and explicitly override
  # inherited credentials where the public endpoint does not require them.
  #
  # They provide integration coverage for the request policy added or
  # significantly expanded by the fork without depending on private services.
  - name: Requests
    slug: requests
    width: wide

    columns:
      - size: medium
        widgets:
          - type: custom-api
            title: Custom API
            url: https://api.github.com/repos/samcro1967/glance
            basic-auth:
              username: ""
              password: ""
            headers:
              Accept: application/vnd.github+json
              X-Glance-Test-Instance: custom-api
            template: |
              <div class="flex flex-column gap-5">
                <div class="size-h4 color-highlight">
                  {{ .JSON.String "full_name" }}
                </div>
                <div>
                  {{ .JSON.String "description" }}
                </div>
                <div class="color-subdue">
                  Stars: {{ .JSON.Int "stargazers_count" | formatNumber }}
                </div>
              </div>


      - size: medium
        widgets:
          - type: custom-api
            title: Custom API - Sprout
            url: https://api.github.com/repos/samcro1967/glance
            basic-auth:
              username: ""
              password: ""
            headers:
              Accept: application/vnd.github+json
              X-Glance-Test-Instance: custom-api-sprout
            template: |
              <div class="flex flex-column gap-5">
                <div class="size-h4 color-highlight">Sprout Runtime Validation</div>
                <div>Repository: {{ .JSON.String "full_name" }}</div>
                <div>Legacy add: {{ add 2 3 }} | Sprout add: {{ sproutAdd 2 3 }}</div>
                <div>Legacy div: {{ div 10 2 }} | Sprout div: {{ sproutDiv 10 2 }}</div>
                <div>Legacy upper: {{ toUpper "glance" }} | Sprout upper: {{ sproutToUpper "glance" }}</div>
                <div>Sprout default: {{ sproutDefault "fallback" "" }}</div>
                <div>Sprout regex: {{ sproutRegexMatch "^samcro1967/.+$" (.JSON.String "full_name") }}</div>
                <div>Sprout list: {{ sproutList "alpha" "bravo" "charlie" | sproutLast }}</div>
                <div>Sprout reverse: {{ sproutList "alpha" "bravo" "charlie" | sproutReverse | sproutJoin ", " }}</div>
                <div>Sprout map: {{ sproutDict "project" (.JSON.String "name") | sproutGet "project" }}</div>
                <div>Sprout Base64: {{ sproutBase64Encode "glance" }}</div>
                <div>Sprout semver: {{ sproutSemverCompare ">=1.0.0" "1.1.1" }}</div>
              </div>

          - type: monitor
            title: Public Monitors
            sites:
              - title: GitHub
                url: https://github.com/
                basic-auth:
                  username: ""
                  password: ""

              - title: Glance
                url: https://github.com/glanceapp/glance
                timeout: 8s
                allow-insecure: false
                headers:
                  X-Glance-Test-Child: monitor
                basic-auth:
                  username: ""
                  password: ""
                same-tab: true

          - type: repository
            title: Glance Repository
            repository: glanceapp/glance

      - size: medium
        widgets:
          - type: bookmarks
            title: Link Policy
            groups:
              - title: Inherited Link Policy
                links:
                  - title: Glance Fork
                    url: https://github.com/samcro1967/glance

              - title: Explicit Same Tab
                same-tab: true
                links:
                  - title: Upstream Glance
                    url: https://github.com/glanceapp/glance

  # ---------------------------------------------------------------------------
  # Pages used to demonstrate named dashboards and the dashboard switcher.
  # ---------------------------------------------------------------------------

  - name: Presentation Small
    slug: presentation-small
    width: wide

    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Presentation Primitives - small
            url: https://api.github.com/repos/samcro1967/glance
            cache: 1h
            headers:
              Accept: application/vnd.github+json
              X-Glance-Test-Instance: presentation-small-primitives
            template: |
              <div class="flex flex-column gap-15">
                <div class="glance-metrics">
                  <div class="glance-metric">
                    <div class="glance-metric-value">{{ .JSON.Int "stargazers_count" | formatNumber }}</div>
                    <div class="glance-metric-label">Stars</div>
                  </div>
                  <div class="glance-metric">
                    <div class="glance-metric-value">{{ .JSON.Int "forks_count" | formatNumber }}</div>
                    <div class="glance-metric-label">Forks</div>
                  </div>
                </div>

                <div class="flex gap-5 flex-wrap">
                  <span class="glance-badge">v0.8.6</span>
                  <span class="glance-status glance-status-positive">Healthy</span>
                  <span class="glance-status glance-status-warning">Warning</span>
                  <span class="glance-status glance-status-negative">Failed</span>
                  <span class="glance-status glance-status-neutral">Unknown</span>
                </div>

                <div class="glance-key-values">
                  <div class="glance-key-value">
                    <span class="glance-key">Repository</span>
                    <span class="glance-value">{{ .JSON.String "full_name" }}</span>
                  </div>
                  <div class="glance-key-value">
                    <span class="glance-key">Language</span>
                    <span class="glance-value">{{ .JSON.String "language" }}</span>
                  </div>
                  <div class="glance-key-value">
                    <span class="glance-key">Open issues</span>
                    <span class="glance-value">{{ .JSON.Int "open_issues_count" | formatNumber }}</span>
                  </div>
                </div>

                <div class="glance-grid">
                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Native Card</div>
                    <div class="color-subdue">Native presentation card</div>
                  </div>
                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Grid Item</div>
                    <div class="color-subdue">Responsive presentation grid</div>
                  </div>
                </div>
              </div>

      - size: full
        widgets:
          - type: custom-api
            title: Presentation Data - full
            url: https://api.github.com/repos/samcro1967/glance
            cache: 1h
            headers:
              Accept: application/vnd.github+json
              X-Glance-Test-Instance: presentation-small-data
            charts:
              request-trend:
                type: line
                height: 180
                legend: true
              cpu-area:
                type: area
                height: 180
                legend: true
                min: 0
                max: 100
                unit: "%"
              latency-bars:
                type: bar
                height: 180
                legend: true
                min: 0
                unit: " ms"
                stacked: false
              service-pie:
                type: pie
                height: 180
                legend: true
              storage-doughnut:
                type: doughnut
                height: 180
                legend: true
              cpu-gauge:
                type: gauge
                height: 140
                min: 0
                max: 100
                unit: "%"
              request-sparkline:
                type: sparkline
                height: 48
            template: |
              <div class="flex flex-column gap-15">
                  <div class="size-h5 color-highlight">Native Table</div>
                  <table class="glance-table" data-glance-table>
                    <thead>
                      <tr>
                        <th data-column="service">Service</th>
                        <th data-column="status">Status</th>
                        <th data-column="latency">Latency</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td>Glance</td>
                        <td>Healthy</td>
                        <td>18 ms</td>
                      </tr>
                      <tr>
                        <td>Sports Feed</td>
                        <td>Healthy</td>
                        <td>42 ms</td>
                      </tr>
                      <tr>
                        <td>Monitoring</td>
                        <td>Degraded</td>
                        <td>126 ms</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div class="size-h5 color-highlight">Native Charts</div>

                <div class="glance-grid">
                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Line</div>
                    <div class="glance-chart" data-glance-chart="request-trend" data-glance-chart-label="Request trend">
                      <script type="application/json">{"labels":["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],"series":[{"label":"Requests","values":[42,55,48,71,66,82,76]}]}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Area</div>
                    <div class="glance-chart" data-glance-chart="cpu-area" data-glance-chart-label="CPU utilization">
                      <script type="application/json">{"labels":["08:00","09:00","10:00","11:00","12:00","13:00"],"series":[{"label":"CPU","values":[22,34,29,51,46,63]}]}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Bar</div>
                    <div class="glance-chart" data-glance-chart="latency-bars" data-glance-chart-label="Service latency">
                      <script type="application/json">{"labels":["Glance","Sports","Monitor"],"series":[{"label":"Latency","values":[18,42,126]}]}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Pie</div>
                    <div class="glance-chart" data-glance-chart="service-pie" data-glance-chart-label="Service distribution">
                      <script type="application/json">{"labels":["Healthy","Warning","Failed"],"values":[72,18,10]}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Doughnut</div>
                    <div class="glance-chart" data-glance-chart="storage-doughnut" data-glance-chart-label="Storage allocation">
                      <script type="application/json">{"labels":["Used","Free"],"values":[68,32]}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Gauge</div>
                    <div class="glance-chart" data-glance-chart="cpu-gauge" data-glance-chart-label="CPU gauge">
                      <script type="application/json">{"value":72,"label":"CPU"}</script>
                    </div>
                  </div>

                  <div class="glance-card">
                    <div class="size-h5 color-highlight">Sparkline</div>
                    <div class="glance-chart" data-glance-chart="request-sparkline" data-glance-chart-label="Seven sample trend">
                      <script type="application/json">{"values":[18,24,21,33,29,41,38,52,47,61]}</script>
                    </div>
                  </div>
                </div>
              </div>

      - size: small
        widgets:
          - type: custom-api
