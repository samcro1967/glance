# Expanded native theme fixture used by the visual QA dashboard.
# This file intentionally exercises the complete public semantic theme contract.
theme:
  custom-css-file: /assets/theme-global.css
  light: false
  background-color: 222 24 6
  primary-color: 214 72 68
  positive-color: 145 55 62
  warning-color: 40 85 65
  negative-color: 4 85 65
  accent-color: 268 78 72
  contrast-multiplier: 1.5
  text-saturation-multiplier: 1.2
  disable-picker: false

  typography:
    font-family: system
    font-size: medium
    font-weight: normal
    text-color: 220 18 91
    secondary-text-color: 220 11 68
    muted-text-color: 220 9 48
    headings:
      font-family: system
      font-size: medium
      font-weight: semibold
      text-color: 220 20 95

  page:
    ambient-accent: subtle
    background-attachment: fixed

  header:
    background-color: 222 21 8
    text-color: 220 18 93
    border-color: 220 12 15
    radius: large
    shadow: subtle
    blur: medium

  navigation:
    text-color: 220 11 68
    hover-color: 220 18 93
    active-color: 220 20 96
    accent-color: 268 78 72
    font-size: medium
    font-weight: semibold

  widgets:
    background-color: 220 19 11
    border-color: 220 12 16
    radius: large
    shadow: subtle
    blur: none

  widget-header:
    background-color: 220 19 11
    text-color: 220 18 93
    accent-color: 268 78 72
    border-color: 220 12 16
    font-size: medium
    font-weight: semibold

  cards:
    background-color: 220 17 14
    border-color: 220 12 19
    radius: large
    shadow: subtle

  groups:
    background-color: 220 19 11
    text-color: 220 11 68
    hover-color: 220 18 90
    active-color: 220 20 96
    accent-color: 268 78 72
    border-color: 220 12 18

  controls:
    background-color: 220 17 14
    text-color: 220 18 91
    muted-color: 220 9 48
    border-color: 220 12 20
    focus-color: 268 78 72
    radius: large
    button:
      background-color: 220 16 16
      text-color: 220 18 91

  footer:
    background-color: 222 21 8
    text-color: 220 9 48
    accent-color: 268 78 72
    border-color: 220 12 15
    font-size: small
    font-weight: medium

  surfaces:
    elevated-background-color: 220 17 14
    elevated-border-color: 220 12 19
    separator-color: 220 12 17

  presets:
    midnight:
      custom-css-file: /assets/theme-preset.css
      light: false
      background-color: 255 28 5
      primary-color: 275 75 70
      positive-color: 145 55 62
      warning-color: 40 85 65
      negative-color: 4 85 65
      accent-color: 285 80 72
      contrast-multiplier: 1.5
      text-saturation-multiplier: 1.2
      widgets:
        background-color: 255 20 11
        border-color: 285 30 28
        radius: large
        shadow: medium
